<!DOCTYPE html>
<html lang="de-AT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wexxxla</title>
<style>
@font-face{font-family:"Big Shoulders Display";font-weight:700;src:url(fonts/big-shoulders-display-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Big Shoulders Display";font-weight:900;src:url(fonts/big-shoulders-display-latin-900-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-style:italic;src:url(fonts/atkinson-hyperlegible-latin-400-italic.woff2) format("woff2")}
:root{
  /* gleiche Farben wie die Website: Würstelstand */
  --rot:#C8102E; --senf:#F3C300; --senf-schatten:#A88600; --tafel:#1D1D1B; --tafel-rand:#2E2E2B;
  --tafel-linie:#4A4A45; --kreide:#F4F4F0; --kreide-grau:#B9BAB2;
  --blech:#E4E8E3; --papier:#FFFFFF; --tinte:#1D1D1B; --grau:#55574F; --linie:#D3D7D1;
  --blau:#2843B8; --gruen:#1F7A4F; --fehler:#B3122B;
  --c-pdf:#C8102E; --c-doc:#2843B8; --c-ppt:#D2541C; --c-xls:#1F7A4F;
  --c-img:#7A3FB8; --c-aud:#B02F74; --c-vid:#0E7383;
  --sign:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --text:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--papier);color:var(--tinte);font:15px/1.5 var(--text);
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blau);outline-offset:2px}
.tafel :focus-visible{outline-color:var(--senf)}

/* ---------- Kopf (rot wie die Website) ---------- */
header{display:flex;align-items:center;gap:20px;padding:12px 24px;background:var(--rot);color:#fff}
.marke{display:flex;align-items:center;gap:10px;font:900 30px/1 var(--sign);letter-spacing:.01em}
.marke svg{flex:none}
.ver{font:700 18px/1 var(--sign);text-transform:uppercase;background:rgba(0,0,0,.18);padding:5px 8px 3px;border-radius:3px;letter-spacing:.03em}
.engines{margin-left:auto;display:flex;gap:18px;font-size:13px;flex-wrap:wrap}
.engine{display:flex;align-items:center;gap:6px;opacity:.75}
.engine.on{opacity:1}
.dot{width:9px;height:9px;border-radius:50%;border:2px solid #fff}
.engine.on .dot{background:var(--senf);border-color:var(--senf)}
.engine button{background:none;border:0;padding:0;color:#fff;font-weight:700;cursor:pointer;text-decoration:underline}

/* ---------- Hauptbereich ---------- */
main{flex:1;display:grid;grid-template-columns:minmax(330px,410px) 1fr;min-height:0}
.col{min-height:0;display:flex;flex-direction:column}
h2{font:900 34px/1 var(--sign);text-transform:uppercase;margin:0 0 14px}
h2 small{font:400 14px/1 var(--text);text-transform:none;color:var(--grau);margin-left:8px;vertical-align:middle}

/* Linke Seite: Dateien */
.dateien{padding:22px 22px 0;background:var(--papier)}
.drop{border:3px dashed #9FA39A;border-radius:6px;background:var(--blech);cursor:pointer;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:28px 24px;
  transition:border-color .12s,background .12s}
.drop:hover{border-color:var(--tinte)}
.drop.big{flex:1;margin-bottom:22px}
.drop.small{flex-direction:row;align-items:center;gap:12px;padding:12px 16px;margin-bottom:12px}
.drop strong{font:900 46px/.92 var(--sign);text-transform:uppercase}
.drop.small strong{font-size:22px}
.drop p{margin:14px 0 0;color:var(--grau);font-size:15px;max-width:28ch}
.drop.small p{display:none}
.drop .plus{display:none;font:900 28px/1 var(--sign);color:var(--rot)}
.drop.small .plus{display:block}
body.dragging .drop{border-color:var(--rot);background:#F8E6E9}

.list{list-style:none;margin:0;padding:0 2px 12px;overflow:auto;flex:1}
.file{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;
  background:var(--papier);border:2px solid var(--tinte);border-radius:4px;padding:10px 10px 10px 10px;margin-bottom:8px}
.badge{font:700 15px/1 var(--sign);letter-spacing:.03em;color:#fff;text-transform:uppercase;
  width:50px;height:50px;border-radius:3px;display:flex;align-items:center;justify-content:center;grid-row:span 2}
.fname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fmeta{font-size:13px;color:var(--grau);min-width:0;grid-column:2}
.fmeta.err{color:var(--fehler);font-weight:700}
.fmeta.ok{color:var(--gruen);font-weight:700}
.x{grid-row:span 2;align-self:start;background:none;border:0;width:30px;height:30px;border-radius:3px;
  color:var(--grau);cursor:pointer;font-size:22px;line-height:1}
.x:hover{background:var(--blech);color:var(--tinte)}
.bar{grid-column:2;height:6px;background:var(--blech);border-radius:1px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--rot);width:0;transition:width .3s}
.actions{grid-column:2 / span 2;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.actions button{border:2px solid var(--tinte);background:var(--papier);border-radius:3px;padding:2px 9px;
  font-size:13px;font-weight:700;cursor:pointer}
.actions button:hover{background:var(--senf)}
.listfoot{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--grau);padding:0 2px 14px}
.link{background:none;border:0;color:var(--rot);font-weight:700;cursor:pointer;padding:0;font-size:14px;text-decoration:underline}

/* Rechte Seite: Bestelltafel */
.tafel{background:var(--tafel);color:var(--kreide);padding:22px 28px 0;overflow:auto;border-left:10px solid var(--tafel-rand)}
.tafel h2{color:var(--senf)}
#tiles{flex:1}
.leer{font:900 40px/1 var(--sign);text-transform:uppercase;margin:24px 0 12px;color:#fff;max-width:14em}
.leer-text{color:var(--kreide-grau);max-width:40ch;margin:0}
.group{margin-bottom:18px}
.group h3{font-size:14px;font-weight:400;color:var(--kreide-grau);margin:0 0 7px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:7px}
.tile{text-align:left;background:transparent;color:var(--kreide);border:2px solid var(--tafel-linie);border-radius:3px;
  padding:9px 10px 7px;cursor:pointer;min-height:62px;display:flex;flex-direction:column;justify-content:space-between;
  border-left:5px solid var(--cat)}
.tile .ext{font:700 25px/1 var(--sign);letter-spacing:.03em;text-transform:uppercase}
.tile .name{font-size:12px;color:var(--kreide-grau);line-height:1.25;margin-top:4px}
.tile:hover{border-color:var(--kreide);border-left-color:var(--cat)}
.tile.sel{background:var(--senf);border-color:var(--senf);color:var(--tinte)}
.tile.sel .name{color:var(--tinte)}
.tile:disabled{cursor:not-allowed;opacity:.4}
.tile:disabled:hover{border-color:var(--tafel-linie);border-left-color:var(--cat)}

.dock{position:sticky;bottom:0;background:var(--tafel);border-top:2px dashed var(--tafel-linie);margin:10px -28px 0;
  padding:16px 28px 18px}
.dockrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.outdir{flex:1;min-width:240px;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--kreide-grau)}
.outdir .path{background:#2A2A27;color:var(--kreide);border:2px solid var(--tafel-linie);border-radius:3px;padding:5px 10px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;direction:rtl;text-align:left}
.btn{border:2px solid var(--tafel-linie);background:transparent;color:var(--kreide);border-radius:3px;padding:5px 12px;
  cursor:pointer;font-size:14px;font-weight:700;white-space:nowrap}
.btn:hover{border-color:var(--kreide)}
.go{background:var(--senf);color:var(--tinte);border:0;border-radius:4px;padding:15px 26px 12px;min-width:250px;
  font:900 27px/1 var(--sign);text-transform:uppercase;cursor:pointer;box-shadow:0 5px 0 var(--senf-schatten);
  transition:transform .08s,box-shadow .08s}
.go:hover{background:#FFD21F}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--senf-schatten)}
.go:disabled{background:#3A3A36;color:#8C8D86;box-shadow:0 5px 0 #2A2A27;cursor:not-allowed;transform:none}
.route{font-size:13px;color:var(--kreide-grau);margin-top:10px;min-height:20px}
.merge{display:flex;align-items:center;gap:8px;font-size:15px;margin-top:12px;color:var(--kreide)}
.merge input{width:18px;height:18px;accent-color:var(--senf)}

details{margin-top:10px;border:2px solid var(--tafel-linie);border-radius:3px}
summary{cursor:pointer;padding:9px 14px;font:700 20px/1 var(--sign);text-transform:uppercase;letter-spacing:.03em}
.settings{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px 22px;padding:6px 14px 16px}
.settings label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--kreide-grau)}
.settings select{background:#2A2A27;color:var(--kreide);border:2px solid var(--tafel-linie);border-radius:3px;padding:5px 8px}
.settings input[type=range]{accent-color:var(--senf)}
.settings .check{flex-direction:row;align-items:center;gap:8px;color:var(--kreide);font-size:14px}
.settings .check input{accent-color:var(--senf);width:16px;height:16px}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--senf);color:var(--tinte);
  padding:12px 20px 10px;border-radius:4px;font:900 22px/1.1 var(--sign);text-transform:uppercase;letter-spacing:.02em;
  box-shadow:0 4px 0 var(--senf-schatten);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.bad{background:var(--rot);color:#fff;box-shadow:0 4px 0 #7A0A1C}
.toast.show{opacity:1}

@media (max-width:820px){
  main{grid-template-columns:1fr}
  .dateien{padding:16px}
  .drop.big{min-height:200px}
  .tafel{padding:16px;border-left:0;border-top:8px solid var(--tafel-rand)}
  .dock{margin:8px -16px 0;padding:14px 16px;position:static}
  header{padding:10px 16px}
  .engines{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="marke">
    <svg width="30" height="30" viewBox="0 0 26 26" aria-hidden="true">
      <rect x="1" y="3" width="13" height="17" rx="2" fill="#fff"/>
      <rect x="12" y="6" width="13" height="17" rx="2" fill="#2843B8"/>
      <path d="M15 14.5h6m-2.5-2.5 2.5 2.5-2.5 2.5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Wexxxla <span class="ver" id="ver"></span>
  </div>
  <div class="engines" id="engines"></div>
</header>

<main>
  <section class="col dateien" aria-label="Deine Dateien">
    <h2>Deine Dateien <small id="count"></small></h2>
    <div class="drop big" id="drop" tabindex="0" role="button" aria-label="Dateien auswählen">
      <span class="plus" aria-hidden="true">+</span>
      <strong id="dropTitle">Ziag de Dateien do eini</strong>
      <p>Oder klick do, dann suachst as aus. Gern a mehrere auf amoi.</p>
    </div>
    <input type="file" id="picker" multiple hidden>
    <ul class="list" id="list"></ul>
    <div class="listfoot" id="listfoot" hidden>
      <span id="summary"></span>
      <button class="link" id="clear">Ois wegräumen</button>
    </div>
  </section>

  <section class="col tafel" aria-label="Zielformat">
    <h2>Wos wüst draus macha?</h2>
    <div id="tiles"></div>

    <div class="dock">
      <div class="dockrow">
        <div class="outdir">
          <span>Ablegen in</span>
          <span class="path" title="" id="outdirWrap"><bdi id="outdir"></bdi></span>
          <button class="btn" id="pick">Ändern</button>
          <button class="btn" id="openout">Aufmachen</button>
        </div>
        <button class="go" id="go" disabled>Umwexxxln</button>
      </div>
      <label class="merge" id="mergeRow" hidden><input type="checkbox" id="merge"> Ois zu ana einzigen PDF zsammpicken</label>
      <div class="route" id="route"></div>
      <details>
        <summary>Einstellungen</summary>
        <div class="settings">
          <label>PDF → PowerPoint
            <select data-opt="pdf_ppt_mode">
              <option value="editable">Bearbeitbar: Text, Tabellen, Formen und Bilder einzeln</option>
              <option value="image">Nur Bilder: jede Seite als Bild (nicht bearbeitbar)</option>
            </select>
          </label>
          <label>PDF → Word
            <select data-opt="pdf_word_mode">
              <option value="auto">Layout-Erkennung (Schriften, Tabellen, Grafiken)</option>
            </select>
          </label>
          <label>Auflösung beim Umwandeln von PDF-Seiten in Bilder
            <select data-opt="pdf_dpi">
              <option value="100">100 dpi (klein)</option>
              <option value="150">150 dpi (Standard)</option>
              <option value="200">200 dpi (scharf)</option>
              <option value="300">300 dpi (Druck)</option>
            </select>
          </label>
          <label>Bildqualität (JPG, WebP): <span id="qv"></span>
            <input type="range" min="40" max="100" step="5" data-opt="image_quality">
          </label>
          <label>Trennzeichen für CSV-Dateien
            <select data-opt="csv_sep">
              <option value=";">Semikolon ; (Excel in Österreich und Deutschland)</option>
              <option value=",">Komma ,</option>
              <option value="tab">Tabulator</option>
            </select>
          </label>
          <label>Videoqualität
            <select data-opt="video_quality">
              <option value="hoch">Hoch (große Datei)</option>
              <option value="normal">Normal</option>
              <option value="klein">Klein (kleine Datei)</option>
            </select>
          </label>
          <label>Office-Programm für Word, Excel und PowerPoint
            <select id="officeEngine">
              <option value="auto">Automatisch (Microsoft Office, sonst LibreOffice)</option>
              <option value="ms">Nur Microsoft Office</option>
              <option value="lo">Nur LibreOffice</option>
            </select>
          </label>
          <label class="check"><input type="checkbox" data-opt="ppt_word_images" data-bool> PowerPoint → Word: Folien als Bild einfügen</label>
        </div>
      </details>
    </div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const CAT_COLOR = {"PDF":"var(--c-pdf)","Dokument":"var(--c-doc)","Präsentation":"var(--c-ppt)",
  "Tabelle":"var(--c-xls)","Bild":"var(--c-img)","Audio":"var(--c-aud)","Video":"var(--c-vid)"};
const CAT_TITLE = {"PDF":"PDF","Dokument":"Dokumente","Präsentation":"Präsentationen","Tabelle":"Tabellen",
  "Bild":"Bilder","Audio":"Musik","Video":"Video"};
let INFO = null, files = [], target = null, busy = false;
const $ = s => document.querySelector(s);

async function api(path, body){
  const r = await fetch(path, {method: body === undefined ? "GET" : "POST",
    headers: {"Content-Type":"application/json"}, body: body === undefined ? undefined : JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("Fehler " + r.status));
  return j;
}
function toast(msg, bad){ const t=$("#toast"); t.textContent=msg; t.classList.toggle("bad", !!bad); t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"), 3400); }
function fmtSize(n){ if(n<1024) return n+" B"; if(n<1048576) return (n/1024).toFixed(0)+" KB";
  if(n<1073741824) return (n/1048576).toFixed(1).replace(".",",")+" MB"; return (n/1073741824).toFixed(2).replace(".",",")+" GB"; }
function catOf(ext){ return INFO.formats[ext] ? INFO.formats[ext].cat : null; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function braucht(s){ return String(s || "").replace(/^benötigt/, "braucht"); }

/* ---------- Start ---------- */
async function init(){
  INFO = await api("/api/info");
  $("#ver").textContent = INFO.version_name || "";
  const t = INFO.tools, ms = t.msoffice.length;
  $("#engines").innerHTML = [
    [ms || t.libreoffice, ms ? "Microsoft Office" : (t.libreoffice ? "LibreOffice" : "Ka Office-Programm")],
    [t.ffmpeg, "Musik & Video"], [t.pandoc, "E-Books & Markdown"]
  ].map(([on,l]) => `<span class="engine ${on?"on":""}"><span class="dot"></span>${l}</span>`).join("")
   + (!ms && !t.libreoffice ? `<span class="engine on"><button id="getLO">LibreOffice gratis holen</button></span>` : "");
  const lo = $("#getLO"); if (lo) lo.onclick = () => api("/api/open-url", {url:"https://de.libreoffice.org/download/download/"});
  applySettings(INFO.settings);
  render();
}
function applySettings(s){
  $("#outdir").textContent = s.out_dir; $("#outdirWrap").title = s.out_dir;
  document.querySelectorAll("[data-opt]").forEach(el => {
    const v = s.options[el.dataset.opt];
    if (el.type === "checkbox") el.checked = String(v) !== "0";
    else if (v !== undefined) el.value = v;
  });
  $("#qv").textContent = s.options.image_quality;
  $("#officeEngine").value = s.office_engine || "auto";
}
document.querySelectorAll("[data-opt]").forEach(el => el.addEventListener("change", async () => {
  const v = el.type === "checkbox" ? (el.checked ? "1" : "0") : el.value;
  if (el.dataset.opt === "image_quality") $("#qv").textContent = v;
  const r = await api("/api/settings", {options: {[el.dataset.opt]: v}}); INFO.settings = r.settings;
}));
$("[data-opt=image_quality]").addEventListener("input", e => $("#qv").textContent = e.target.value);
$("#officeEngine").onchange = async e => {
  const r = await api("/api/settings", {office_engine: e.target.value}); INFO.settings = r.settings;
  const fr = await api("/api/refresh", {ids: files.map(f => f.id)});
  fr.files.forEach(n => Object.assign(files.find(f => f.id === n.id), {targets:n.targets, unavailable:n.unavailable}));
  render();
};

/* ---------- Dateien hinzufügen ---------- */
const drop = $("#drop"), picker = $("#picker");
drop.onclick = () => picker.click();
drop.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); picker.click(); } };
picker.onchange = () => { addFiles([...picker.files]); picker.value = ""; };
let dragDepth = 0;
window.addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; document.body.classList.add("dragging"); });
window.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => { e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");
  const list = [...(e.dataTransfer.files || [])].filter(f => f.size > 0 || f.type); if (list.length) addFiles(list); });

function addFiles(list){
  for (const f of list){
    const ext = (f.name.includes(".") ? f.name.split(".").pop() : "").toLowerCase();
    const item = {tmp: Math.random().toString(36).slice(2), name: f.name, ext, size: f.size, uploading: true,
      progress: 0, state: "uploading", targets: [], unavailable: {}, outputs: []};
    files.push(item);
    upload(f, item);
  }
  render();
}
function upload(f, item){
  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/upload?name=" + encodeURIComponent(f.name));
  xhr.upload.onprogress = e => { if (e.lengthComputable) { item.progress = e.loaded / e.total; renderList(); } };
  xhr.onload = () => {
    if (xhr.status !== 200) { item.state = "error"; item.error = "Laden is schiefgangen."; render(); return; }
    Object.assign(item, JSON.parse(xhr.responseText), {uploading: false, progress: 0, state: "ready"});
    if (!item.supported) { item.state = "error"; item.error = "Des Format kenn i ned."; }
    render();
  };
  xhr.onerror = () => { item.state = "error"; item.error = "Laden is schiefgangen."; render(); };
  xhr.send(f);
}
async function removeFile(item){
  files = files.filter(f => f !== item);
  if (item.id) api("/api/remove", {id: item.id}).catch(()=>{});
  render();
}
$("#clear").onclick = () => { if (busy) return; [...files].forEach(removeFile); target = null; render(); };

/* ---------- Darstellung ---------- */
function render(){ renderList(); renderTiles(); renderDock(); }

function renderList(){
  const has = files.length > 0;
  drop.className = "drop " + (has ? "small" : "big");
  $("#dropTitle").textContent = has ? "No mehr eini" : "Ziag de Dateien do eini";
  $("#count").textContent = has ? files.length + (files.length === 1 ? " Datei" : " Dateien") : "";
  $("#listfoot").hidden = !has;
  const done = files.filter(f => f.state === "done").length;
  $("#summary").textContent = done ? `${done} von ${files.length} umgwexxxlt` : "";
  $("#list").innerHTML = files.map((f, i) => {
    const shownExt = f.state === "done" && f.outputs && f.outputs[0] && !f.outputs[0].isdir
      ? f.outputs[0].name.split(".").pop().toLowerCase() : f.ext;
    const cat = INFO && catOf(shownExt);
    const color = CAT_COLOR[cat] || "var(--grau)";
    let meta = fmtSize(f.size), cls = "";
    if (f.state === "uploading") meta = "Wird glodn …";
    if (f.state === "waiting") meta = "Wart a bissl …";
    if (f.state === "running") meta = f.msg || "Wird umgwexxxlt …";
    if (f.state === "done") { meta = "Passt! " + (f.msg || "Fertig"); cls = "ok"; }
    if (f.state === "error") { meta = f.error || "Is schiefgangen."; cls = "err"; }
    const showBar = f.state === "uploading" || f.state === "running";
    const acts = f.state === "done" ? (f.outputs || []).map((o, k) =>
      `<div class="actions">
         ${o.isdir ? "" : `<button data-act="open" data-i="${i}" data-k="${k}">Aufmachen</button>`}
         <button data-act="reveal" data-i="${i}" data-k="${k}">Im Ordner zoagn</button>
         <button data-act="save" data-i="${i}" data-k="${k}">${o.isdir ? "Als ZIP speichern" : "Kopie speichern"}</button>
       </div>`).join("") : "";
    return `<li class="file">
      <span class="badge" style="background:${color}">${esc((shownExt || "?").toUpperCase().slice(0,5))}</span>
      <span class="fname" title="${esc(f.name)}">${esc(f.state === "done" && f.outputs && f.outputs[0] ? f.outputs[0].name : f.name)}</span>
      <button class="x" data-act="rm" data-i="${i}" aria-label="${esc(f.name)} wegtoan" ${busy ? "disabled" : ""}>×</button>
      ${showBar ? `<span class="bar"><i style="width:${Math.round((f.progress||0)*100)}%"></i></span>` :
        `<span class="fmeta ${cls}">${esc(meta)}</span>`}
      ${acts}
    </li>`;
  }).join("");
}
$("#list").onclick = async e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const f = files[+b.dataset.i]; if (!f) return;
  if (b.dataset.act === "rm") return removeFile(f);
  const o = f.outputs[+b.dataset.k];
  try {
    if (b.dataset.act === "open") await api("/api/open", {path: o.path, what: "open"});
    if (b.dataset.act === "reveal") await api("/api/open", {path: o.path, what: "reveal"});
    if (b.dataset.act === "save") { const a = document.createElement("a");
      a.href = "/api/download?path=" + encodeURIComponent(o.path); a.download = ""; a.click(); }
  } catch (err) { toast(err.message, true); }
};

function usable(){ return files.filter(f => f.id && f.supported && f.state !== "uploading"); }
function commonTargets(){
  const u = usable(); if (!u.length) return {ok: [], na: {}};
  let ok = new Set(u[0].targets);
  u.slice(1).forEach(f => { ok = new Set(f.targets.filter(t => ok.has(t))); });
  const na = {};
  u.forEach(f => Object.entries(f.unavailable || {}).forEach(([k, v]) => { if (!ok.has(k)) na[k] = v; }));
  return {ok: [...ok], na};
}
function leer(titel, text){
  return `<p class="leer">${titel}</p><p class="leer-text">${text}</p>`;
}
function renderTiles(){
  const box = $("#tiles");
  if (!INFO) return;
  const u = usable();
  if (!u.length) {
    box.innerHTML = files.length
      ? (files.some(f => f.state === "uploading") ? leer("Moment …", "De Dateien werden grad glodn.")
                                                   : leer("Hm, des kenn i ned.", "Mit de Dateien kann Wexxxla nix anfangen. Probier a PDF, a Word-Datei, a Foto oder a Video."))
      : leer("Na, wos darf's sein?", "Ziag links a Datei eini. Dann steht do auf da Tafel, wos ma draus macha kann.");
    target = null; return;
  }
  const {ok, na} = commonTargets();
  if (target && !ok.includes(target)) target = null;
  if (!ok.length && !Object.keys(na).length) {
    box.innerHTML = leer("De Mischung geht ned zsamm.", "Wexxxl de Dateien getrennt, zum Beispiel z'erst de Fotos und dann de Videos.");
    return;
  }
  const srcExts = new Set(u.map(f => f.ext));
  box.innerHTML = INFO.categories.map(cat => {
    const fmts = Object.keys(INFO.formats).filter(k => INFO.formats[k].cat === cat && (ok.includes(k) || na[k]) && !(srcExts.size === 1 && srcExts.has(k)));
    if (!fmts.length) return "";
    return `<div class="group"><h3>${CAT_TITLE[cat]}</h3><div class="tiles">` + fmts.map(k => {
      const off = !ok.includes(k);
      const label = INFO.formats[k].label.replace(/\s*\(\.[a-z]+\)$/, "");
      return `<button class="tile ${target === k ? "sel" : ""}" data-fmt="${k}" style="--cat:${CAT_COLOR[cat]}"
        ${off ? `disabled title="${esc(braucht(na[k]))}"` : ""} aria-pressed="${target === k}">
        <span class="ext">${k.toUpperCase()}</span><span class="name">${esc(off ? braucht(na[k]) : label)}</span></button>`;
    }).join("") + `</div></div>`;
  }).join("");
}
$("#tiles").onclick = e => {
  const t = e.target.closest(".tile"); if (!t || t.disabled || busy) return;
  target = t.dataset.fmt; render(); showRoute();
};
async function showRoute(){
  const u = usable(), exts = [...new Set(u.map(f => f.ext))];
  if (!target || exts.length !== 1) { $("#route").textContent = ""; return; }
  try { const r = await api("/api/route", {src: exts[0], dst: target});
    $("#route").textContent = r.route.includes("→", r.route.indexOf("→") + 1) ? "Wexxxla nimmt an Umweg: " + r.route : "";
  } catch { $("#route").textContent = ""; }
}
function renderDock(){
  const u = usable();
  const go = $("#go");
  go.disabled = busy || !target || !u.length;
  go.textContent = busy ? "Wird umgwexxxlt …" : target ? `In ${target.toUpperCase()} umwexxxln`
                 : u.length ? "Format aussuachn" : "Umwexxxln";
  const mergeOk = target === "pdf" && u.length > 1;
  $("#mergeRow").hidden = !mergeOk;
  if (!mergeOk) $("#merge").checked = false;
  if (!target) $("#route").textContent = "";
}

/* ---------- Ordner ---------- */
$("#pick").onclick = async () => { try { const r = await api("/api/pick-folder", {});
  INFO.settings.out_dir = r.out_dir; applySettings(INFO.settings); } catch (e) { toast(e.message, true); } };
$("#openout").onclick = () => api("/api/open", {what: "outdir"}).catch(e => toast(e.message, true));

/* ---------- Umwexxxln ---------- */
$("#go").onclick = async () => {
  const u = usable(); if (!u.length || !target) return;
  busy = true; u.forEach(f => Object.assign(f, {state: "waiting", progress: 0, outputs: [], error: ""}));
  render();
  try {
    const {job} = await api("/api/convert", {ids: u.map(f => f.id), target, merge: $("#merge").checked});
    await poll(job);
  } catch (e) { toast(e.message, true); }
  busy = false; render();
  const ok = u.filter(f => f.state === "done").length, bad = u.length - ok;
  if (!bad) toast(ok === 1 ? "Oida, leiwaund! Passt." : `Oida, leiwaund! ${ok} Dateien passen.`);
  else if (!ok) toast("Hoppala, des is schiefgangen.", true);
  else toast(`${ok} passen, ${bad} san schiefgangen.`, true);
};
async function poll(job){
  for (;;) {
    const j = await api("/api/job?id=" + job);
    j.items.forEach(it => { const f = files.find(x => x.id === it.id); if (f) Object.assign(f, {
      state: it.state, progress: it.progress, msg: it.msg, outputs: it.outputs, error: it.error}); });
    renderList();
    if (j.done) return;
    await new Promise(r => setTimeout(r, 400));
  }
}

/* ---------- Lebenszeichen an den Server ---------- */
setInterval(() => fetch("/api/ping", {method: "POST"}).catch(()=>{}), 5000);
fetch("/api/ping", {method: "POST"}).catch(()=>{});
window.addEventListener("pagehide", () => navigator.sendBeacon("/api/bye"));

init().catch(e => { document.body.innerHTML = "<p style='padding:2rem'>Hoppala, beim Starten is was schiefgangen: " + esc(e.message) + "</p>"; });
</script>
